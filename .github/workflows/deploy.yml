name: Deploy site

# Publishes dist/ to GitHub Pages on every push to main.
# Custom domain: set repository variable SITE_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://yourdomain.com  - canonical URLs, sitemap, robots and the CNAME file all follow it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CNAME: ${{ vars.SITE_URL != '' && '1' || '' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
