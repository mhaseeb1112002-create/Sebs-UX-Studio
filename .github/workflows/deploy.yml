name: Deploy site

# Publishes dist/ to GitHub Pages on every push to main (and the working branch).
# No domain yet: served at https://<owner>.github.io/<repo>/ (BASE_PATH handled automatically).
# Custom domain: set repository variable SITE_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://yourdomain.com - canonical URLs, sitemap, robots, CNAME and root paths all follow it.
on:
  push:
    branches: [main, claude/confident-cori-8siyea]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          CUSTOM_URL: ${{ vars.SITE_URL || 'https://sebsuxstudio.com' }}
          # Owner login (optional). Set both repository variables to switch it on, see README.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CHECKLIST_ENDPOINT: ${{ vars.CHECKLIST_ENDPOINT || 'https://formspree.io/f/mqppgndj' }}
        run: |
          if [ -n "$CUSTOM_URL" ]; then
            export SITE_URL="$CUSTOM_URL" CNAME=1 BASE_PATH=""
          else
            REPO="${GITHUB_REPOSITORY#*/}"
            export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO}" BASE_PATH="/${REPO}"
          fi
          echo "SITE_URL=$SITE_URL BASE_PATH=$BASE_PATH"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
